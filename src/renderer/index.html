<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:" />
  <title>DLSS 5 Swapper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <!-- ---------------- sidebar ---------------- -->
    <aside class="sidebar">
      <div class="brand" id="brand"></div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="games">
          <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 11v3m-1.5-1.5h3M16 12h.01M18.5 14h.01"/></svg>
          <span data-i18n="navGames">Games</span><i class="dot"></i>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.5 14.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.4 1z"/></svg>
          <span data-i18n="navSettings">Settings</span><i class="dot"></i>
        </button>
        <button class="nav-item" data-view="about">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
          <span data-i18n="navAbout">About</span><i class="dot"></i>
        </button>
      </nav>

      <div class="status-card">
        <div class="status-line"><i class="live"></i><b id="statusText" data-i18n="ready">Ready</b></div>
        <p class="status-sub">DLSS 5 Swapper</p>
        <p class="status-sub" id="statusVersion"></p>
        <a class="status-update hidden" id="statusUpdate" href="https://github.com/rakanki911/DLSS5-Swapper/releases/latest" data-project="releases"></a>
        <div class="bar"><i id="statusBar" style="width:22%"></i></div>
      </div>
    </aside>

    <!-- ---------------- main ---------------- -->
    <div class="main">
      <div class="toolbar">
        <button id="themeBtn" class="round" title="Theme">
          <svg viewBox="0 0 24 24" id="themeIcon"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
        </button>
        <div class="lang-wrap">
          <button id="langBtn" class="pill">
            <span id="langLabel">EN</span>
            <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="lang-menu hidden" id="langMenu"></div>
        </div>
        <button class="win" id="winMin" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
        </button>
        <button class="win" id="winMax" title="Maximize" aria-label="Maximize">
          <svg viewBox="0 0 24 24" id="winMaxIcon"><rect x="6" y="6" width="12" height="12"/></svg>
        </button>
        <button class="win close" id="winClose" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>

      <!-- GAMES -->
      <section class="view active" id="view-games">
        <div class="glass dropzone" id="dropZone">
          <div class="dz-circle">
            <svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </div>
          <h2 data-i18n="dropTitle">Drop game folder here</h2>
          <p class="or" data-i18n="or">or</p>
          <button class="glass-btn" id="browseBtn" data-i18n="browse">Browse Folder</button>
        </div>

        <div class="section-head">
          <h3 data-i18n="recentTitle">Recent Games</h3>
        </div>
        <div class="recents" id="recents"></div>

        <div class="section-head games-heading">
          <h3><span id="gamesTitle" data-i18n="gamesTitle">Games</span> <span class="count" id="gamesCount" role="status" aria-live="polite"></span></h3>
          <div class="row">
            <button class="ghost sm" id="addGame" data-i18n="addGame">Add a game</button>
            <button class="ghost sm" id="addFolder" data-i18n="addFolder">Add a folder</button>
            <button class="glass-btn sm" id="rescan" data-i18n="rescan">Rescan</button>
          </div>
        </div>
        <div class="game-filters" role="search" aria-labelledby="gamesTitle">
          <label class="game-search"><span data-i18n="searchGames">Search games</span>
            <input id="gameSearch" type="search" autocomplete="off" spellcheck="false" aria-controls="groups">
          </label>
          <label><span data-i18n="fApi">Rendering API</span><select id="gameApi" aria-controls="groups"></select></label>
          <label><span data-i18n="filterDlss">DLSS status</span><select id="gameDlss" aria-controls="groups"></select></label>
          <label><span data-i18n="filterAddon">Add-on</span><select id="gameAddon" aria-controls="groups"></select></label>
          <button class="ghost sm" id="clearGameFilters" data-i18n="clearFilters">Clear filters</button>
        </div>
        <div class="game-quick-filters" id="gameQuickFilters"></div>
        <div id="groups"></div>

        <div class="section-head">
          <h3 data-i18n="logTitle">Activity Log</h3>
          <div class="row">
            <button class="ghost sm" id="copyLog" data-i18n="copyLog" disabled>Copy log</button>
            <button class="ghost sm" id="clearLog" data-i18n="clear">Clear</button>
          </div>
        </div>
        <div class="glass log" id="log"></div>
      </section>

      <section class="view" id="view-settings">
        <div class="section-head"><h3 data-i18n="navSettings">Settings</h3></div>
        <div class="glass pad" id="settings"></div>
      </section>

      <!-- ABOUT -->
      <section class="view" id="view-about">
        <div class="section-head"><h3 data-i18n="navAbout">About</h3></div>
        <div class="glass pad about">
          <p><b data-i18n="aboutTitle">DLSS 5 Swapper</b></p>
          <p data-i18n="aboutBody"></p>
          <div class="about-links">
            <a class="glass-btn" href="https://github.com/rakanki911/DLSS5-Swapper" data-project="github">GitHub ↗</a>
            <a class="glass-btn" href="https://github.com/rakanki911/DLSS5-Swapper/releases/latest" data-project="releases"><span data-i18n="latestReleases">Latest releases</span> ↗</a>
          </div>
          <p class="hint hidden" id="projectLinkError" role="status" data-i18n="errProjectLink"></p>
          <div class="support">
            <p class="support-line" data-i18n="supportBody"></p>
            <div class="support-row">
              <a href="https://buymeacoffee.com/rakanki911" data-project="coffee" class="support-button">
                <img src="support-coffee.png" alt="Buy me a coffee" height="40">
              </a>
              <img class="support-qr" src="support-qr.png" alt="Buy me a coffee QR code" width="112" height="112">
            </div>
          </div>
          <p class="dim" data-i18n="aboutBy">Built by Rakan Alkhaldi</p>
        </div>
      </section>
    </div>
  </div>

  <!-- game detail sheet -->
  <div class="overlay hidden" id="overlay">
    <div class="sheet" id="sheet"></div>
  </div>
  <div id="copyFeedback" class="copy-feedback hidden" role="status" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="i18n-extra.js"></script>
  <script src="../shared/feature-i18n.js"></script>
  <script src="game-filters.js"></script>
  <script src="../shared/install-routes.js"></script>
  <script src="../shared/rendering-api.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
